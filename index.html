<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0d1522" />
    <meta name="description" content="Adaptive Web — signal-adaptive delivery that adapts to each user's real network and device. Hackathon 2026 · Web Performance track." />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Adaptive Web — Aurora Goods</title>
    <script>
      // Resolve the theme before the first paint, so a stored choice is honoured
      // and 'system' never flashes the wrong theme. The same rules live in
      // src/theme.js for the React side.
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var preference = (stored === 'light' || stored === 'dark') ? stored : 'system'
          var dark = preference === 'dark' ||
            (preference === 'system' && window.matchMedia &&
             window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
